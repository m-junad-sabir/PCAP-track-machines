return `<div class=grid><div class=card><h3>${q?"QIC records":"DIC records"} <span class=note>(${list.length})</span></h3><div class=tw><table><thead><tr><th>Machine</th><th>Farmer</th><th>${q?"Division":"District"}</th><th>Cert #</th><th>Status</th><th>Date</th><th>FE</th></tr></thead><tbody>${list.map(m=>`<tr class="clk ${m.id==S.sel?"sel":""}" onclick="S.sel='${m.id}';render(1)"><td>${m.id}</td><td>${m.farmer}</td><td>${q?m.div:m.dist}</td><td>${q?m.qicNo:m.dicNo}</td><td>${tg(q?m.qicStatus:m.dicStatus)}</td><td>${q?m.qicDate:m.dicDate}</td><td>${q?m.qicFE:m.dicFE}</td></tr>`).join("")||"<tr><td>No records</td></tr>"}</tbody></table></div></div>${s?det(s):`<div class=card><span class=note>Select a record to see the linked QIC → DIC chain, certificate columns and log.</span></div>`}</div>`}
function det(m){return `<div class=card><h3>${m.id}</h3><span class=note>Chain of custody: ${m.qicStatus?"QIC "+m.qicDate:"not inspected"} → ${m.dicStatus?"DIC "+m.dicDate:"not verified"}</span><h4>Certificate (6 columns)</h4><table>${[["Allottee",m.farmer],["CNIC",m.cnic],["Mailing address",m.addr],["Tehsil",m.tehsil],["Machine ID",m.id],["Tracker IMEI",m.imei],["Punched code",m.code],["QIC GPS (firm)",m.lat?m.lat+", "+m.lng:"—"],["DIC GPS (farmer)",m.dlat?m.dlat+", "+m.dlng:"—"],["Reason (if deferred)",m.reason||"—"]].map(r=>`<tr><td>${r[0]}</td><td class=wrap>${r[1]}</td></tr>`).join("")}</table><h4>Discrepancy / correction log</h4>${m.log.length?m.log.map(l=>`<div class=note>${l.t} · ${l.who}: ${l.m}</div>`).join(""):`<span class=note>No entries</span>`}</div>`}
function disc(){const l=M.filter(m=>m.open);return `<div class=card><h3>Open discrepancies (${l.length})</h3>${l.map(m=>`<div class=card><b>${m.id}</b> · ${m.farmer}<br>${m.log.slice(-1)[0].m}<div class=filters style="margin-top:8px"><button class="btn alt sm" onclick="res('${m.id}','QIC convener corrected the record on the departmental portal')">Corrected by QIC convener</button><button class="btn alt sm" onclick="res('${m.id}','Convener noted it on the certificate under signature; machine approved')">Noted under convener signature</button></div></div>`).join("")||`<span class=note>No open discrepancies.</span>`}<p class=note>QIC discrepancies are corrected by the QIC convener; DIC discrepancies are recorded as a signed note. Nothing is overwritten; each action is appended to the log.</p></div>`}
function res(id,t){const m=M.find(x=>x.id==id);m.log.push({t:"2026-09-28",who:"Project Lead",m:t});m.open=false;toast("Resolution logged");render(1)}
function rep(){const T=[["qs","QIC summary"],["ds","DIC summary"],["qp","QIC progress (15 col.)"],["dp","DIC progress (15 col.)"]],w=S.rep;let h=`<div class=card><div class=filters>${T.map(t=>`<button class="btn sm ${w==t[0]?"":"alt"}" onclick="S.rep='${t[0]}';render(1)">${t[1]}</button>`).join("")}<select><option>Monthly</option><option>Quarterly</option><option>Annual</option></select><button class="btn sm" onclick="toast('Excel (.xlsx) export only, as per SOP. No PDF or image.')">Export Excel</button></div>`;
const cnt=(a,f)=>[...new Set(a.map(f))].length;
if(w=="qs"){const ds=[...new Set(M.filter(m=>m.qicStatus).map(m=>m.div))];h+=tbl(["Sr.","Division","QIC meetings held","Inspected","Approved","Deferred","Reason for deferment"],ds.map((d,i)=>{const a=M.filter(m=>m.qicStatus&&m.div==d);return[i+1,d,cnt(a,m=>m.qicDate+m.firm),a.length,a.filter(m=>m.qicStatus=="Approved").length,a.filter(m=>m.qicStatus=="Deferred").length,a.map(m=>m.reason).filter(x=>x).join("; ")||"—"]}))}
if(w=="ds"){const ds=[...new Set(M.filter(m=>m.dicStatus).map(m=>m.dist))];h+=tbl(["Sr.","District","DIC meetings held","Verified","Approved","Deferred","Reason for deferment"],ds.map((d,i)=>{const a=M.filter(m=>m.dicStatus&&m.dist==d);return[i+1,d,cnt(a,m=>m.dicDate),a.length,a.filter(m=>m.dicStatus=="Approved").length,a.filter(m=>m.dicStatus=="Deferred").length,a.map(m=>m.reason).filter(x=>x).join("; ")||"—"]}))}
if(w=="qp")h+=tbl(["Sr. No","Division","District","Firm Name","Farmer Name","CNIC","Contact No.","QIC Certificate #","Status of Inspection","Unique ID","GIS Lat.","GIS Lng.","Punched Code","Inspection Date","Name of FE"],M.filter(m=>m.qicStatus).map((m,i)=>[i+1,m.div,m.dist,m.firm,m.farmer,m.cnic,m.contact,m.qicNo,m.qicStatus,m.id,m.lat,m.lng,m.code,m.qicDate,m.qicFE]));
if(w=="dp")h+=tbl(["Sr. No","District","Farmer Name","Father Name","CNIC #","Address","Contact No.","DIC Certificate #","Status of Verification","Unique ID","GPS Lat.","GPS Lng.","Punched Code","Inspection Date","Name of FE"],M.filter(m=>m.dicStatus).map((m,i)=>[i+1,m.dist,m.farmer,m.father,m.cnic,m.addr,m.contact,m.dicNo,m.dicStatus,m.id,m.dlat,m.dlng,m.code,m.dicDate,m.dicFE]));
return h+`<p class=note>Built from live records. Progress reports export as Excel only.</p></div>`}
function tbl(h,r){return `<div class=tw><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")||"<tr><td>No data</td></tr>"}</tbody></table></div>`}
function cfg(){let g="",h="";PR.forEach(p=>{if(p.g!=g){if(g)h+="</table></details>";g=p.g;h+=`<details><summary>${g}</summary><table>`}h+=`<tr><td>${p.n}</td><td class=wrap><b>${p.name}</b><br><span class=note>${p.req}</span></td></tr>`});
return `<div class=card><div class=row><h3>Super Seeder · v1</h3><button class="btn alt sm" onclick="toast('New machine types need their own approved specification and sampling scheme from PCAP')">+ Add machine type</button></div><p class=note>Parameters, sampling table and photo sets are data, not code. New machine types are onboarded here.</p></div>
<div class=grid><div class=card><h3>49-parameter checklist (Appendix-II)</h3>${h}</table></details></div><div><div class=card><h3>PSQCA sampling (Table A-1)</h3>${tbl(["Lot","Sample","Max def.","Sub-sample","Max def."],SAMP.map(s=>[s[5],s[1],s[2],s[3],s[4]]))}</div><div class=card><h3>Required photos</h3><b>QIC</b><ol>${QP.map(p=>`<li class=note>${p}</li>`).join("")}</ol><b>DIC</b><ol>${DP.map(p=>`<li class=note>${p}</li>`).join("")}</ol></div></div></div>`}
render(1);
</script></body></html>
